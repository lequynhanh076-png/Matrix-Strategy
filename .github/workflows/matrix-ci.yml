name: Matrix Multi-OS Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven

        run: |
          mvn clean package -Dcheckstyle.skip

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BankSystem-Jar-${{ matrix.os }}
          path: "**/target/*.jar"