name: Matrix Multi-OS Test

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    # Cấu hình Matrix Strategy
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests on ${{ matrix.os }}
        # Chạy test và package, bỏ qua checkstyle để tập trung vào Matrix
        run: mvn clean package -Dcheckstyle.skip